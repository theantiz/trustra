spring.application.name=Trustra
server.port=8080

# PostgreSQL Database Configuration with sensible local defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trustra}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Production Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=TrustraHikariPool
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:20000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Scheduling
trustra.scheduling.recalculation.enabled=${RECALCULATION_ENABLED:true}
trustra.scheduling.recalculation.fixed-rate-ms=${RECALCULATION_RATE_MS:30000}

# Security & JWT Configuration
trustra.security.jwt.secret=${JWT_SECRET:trustra-fintech-super-secure-jwt-signing-secret-key-32bytes}
trustra.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
trustra.frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
