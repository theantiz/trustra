spring.datasource.url=jdbc:h2:mem:trustra;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP Test Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=TrustraTestHikariPool

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

trustra.scheduling.recalculation.enabled=false
trustra.frontend.origin=http://localhost:3000
trustra.security.jwt.secret=test-secret-key-for-unit-and-integration-tests-32bytes
trustra.security.jwt.expiration-seconds=3600
