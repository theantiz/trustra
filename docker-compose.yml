services:
  postgres:
    image: postgres:16-alpine
    container_name: trustra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustra"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustra-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trustra
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET: trustra-fintech-super-secure-jwt-signing-secret-key-32bytes
      JWT_EXPIRATION_SECONDS: 86400
      RECALCULATION_ENABLED: "true"
      RECALCULATION_RATE_MS: "30000"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustra-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
